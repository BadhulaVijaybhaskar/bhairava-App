services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bhairava
      POSTGRES_PASSWORD: bhairava
      POSTGRES_DB: bhairava
    ports:
      - "5432:5432"
    volumes:
      - bhairava_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhairava -d bhairava"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bhairava_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://bhairava:bhairava@postgres:5432/bhairava?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-dev-only-32chars-min
      JWT_REFRESH_SECRET: change-me-refresh-dev-only-32chars-min
      JWT_ACCESS_TTL_SEC: "900"
      JWT_REFRESH_TTL_SEC: "604800"
      COOKIE_SECURE: "false"
      PII_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: bhairava
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://bhairava:bhairava@postgres:5432/bhairava?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  bhairava_pg:
  bhairava_minio:
